
name: ExpenseHub Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d expense_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure test environment
        run: |
          echo "DATABASE_URL=postgresql://root:testpassword@localhost:5432/expense_tracker_test" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=postgresql://root:testpassword@localhost:5432/expense_tracker_test" >> $GITHUB_ENV
      - name: Run tests
        run: python -m pytest -v
